name: Decks préconstruits (Jouer)

# Chaque mardi : decks recommandés du site officiel One Piece et decks à thème Pokémon (scripts/build-decks.mjs).
on:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:
    inputs:
      only:
        description: 'Jeu à refaire (onepiece ou pokemon) — vide = les deux'
        required: false
        default: ''

permissions:
  contents: write
  pages: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  decks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decks
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: node scripts/build-decks.mjs
      - name: Enregistrer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "kirakai"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/decks
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Decks préconstruits du $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then gh api -X POST "repos/${{ github.repository }}/pages/builds" || true; fi
