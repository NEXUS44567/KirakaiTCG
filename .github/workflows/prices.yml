name: Relevé des prix

on:
  schedule:
    - cron: '17 5 * * *'   # chaque jour vers 6 h 17 (heure de Paris en hiver)
  workflow_dispatch:
    inputs:
      only:
        description: 'Jeux à relever (onepiece,pokemon) — vide = tous'
        required: false
        default: ''

permissions:
  contents: write
  pages: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relever les prix
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
          ONLY: ${{ github.event.inputs.only }}
        run: node scripts/fetch-prices.mjs
      - name: Enregistrer le relevé
        run: |
          git config user.name "kirakai"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Relevé des prix du $(date -u +%F)"
          git pull --rebase origin main
          git push
      - name: Republier le site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
